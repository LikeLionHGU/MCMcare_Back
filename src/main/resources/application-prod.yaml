# 배포 전용 설정
#   실행:  java -jar app.jar --spring.profiles.active=prod
#
# 이 프로필에서는 SecretsCheck 가 개발용 기본 비밀값을 감지하면 기동을 중단시킨다.
# 아래 값을 반드시 환경변수로 주입할 것 — 하나라도 빠지면 기동에 실패한다.
#
#   JWT_SECRET         JWT 서명 키 (32바이트 이상)
#   ADMIN_KEY          관리자 API 헤더 값
#   FILE_SIGN_SECRET   파일 URL 서명 키
#   DB_PASSWORD        DB 비밀번호
#
# 전체 목록은 .env.example 참고.

spring:
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않는다.
      # 엔티티와 실제 테이블이 어긋나면 기동 시점에 바로 드러난다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false

app:
  estimate:
    # 배포에서는 실제 AI 를 사용한다.
    # stub 으로 두면 기동은 되지만 EstimateProviderCheck 가 경고를 남긴다.
    provider: ${ESTIMATE_PROVIDER:model}

  demo:
    # 기사 앱 배포 후에는 자동 인계를 끈다
    auto-handover: false
    handover-interval-ms: ${HANDOVER_INTERVAL_MS:60000}

springdoc:
  api-docs:
    # 배포 URL 이 공개 상태이므로 API 문서를 노출하지 않는다
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.ladder.mcmcare: INFO
    org.hibernate.SQL: WARN
