spring:
  application:
    name: mcmcare

  datasource:
    # 실제 비밀번호는 커밋하지 않는다. 기본값은 로컬 개발용 자리표시자다.
    # prod 프로필에서 이 기본값이 그대로 쓰이면 SecretsCheck 가 기동을 중단시킨다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mcmcare}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:local-dev-only-db-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 엔티티 기준 자동 생성. 인덱스·제약은 @Table 에 명시돼 있다.
      # 배포에서 스키마를 고정하려면 JPA_DDL_AUTO=validate 로 주입한다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB         # 기본 1MB → 사진 업로드 시 반드시 상향
      max-request-size: 40MB

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # ⚠️ 배포 시 JWT_SECRET 환경변수를 반드시 주입한다.
    #    미주입이면 SecretsCheck 가 기동을 중단시킨다 (local 프로필 제외).
    secret: ${JWT_SECRET:local-dev-only-secret-key-not-for-production-32b}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}

  # ⚠️ 배포 시 ADMIN_KEY 환경변수를 반드시 주입한다.
  admin-key: ${ADMIN_KEY:local-dev-only-admin-key}

  google:
    # 구글 OAuth 클라이언트 ID.
    # ID 토큰의 aud 가 이 값과 일치하는지 검증한다 — 다른 앱의 토큰을 막기 위함이다.
    # 프론트에도 같은 값이 들어간다 (공개용 값이라 노출돼도 무방하다).
    client-id: ${GOOGLE_CLIENT_ID:791833549192-had1roq7sg1d3r8r2u0v7rm1shm8ost5.apps.googleusercontent.com}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  number:
    as-format: "AS-%d-%05d"       # AS-2026-00341
    pickup-format: "PKP-%d-%06d"  # PKP-2026-000847

  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${FILE_BASE_URL:http://localhost:8080/files}

    # 파일 URL 서명 키. 손상 사진 · 전자서명은 개인정보이므로
    # URL 만 안다고 열리지 않도록 만료 시각과 서명을 붙인다.
    # ⚠️ 배포 시 반드시 환경변수로 교체한다.
    sign-secret: ${FILE_SIGN_SECRET:local-dev-only-file-sign-secret-key-32b}

    # 서명 유효 시간(초). 화면을 오래 열어둬도 이미지가 깨지지 않을 만큼 넉넉히 잡는다.
    # 만료되면 새로고침 시 새 URL 을 받는다.
    sign-ttl-seconds: ${FILE_SIGN_TTL_SECONDS:86400}

  estimate:
    # AI 서버는 EUR 로 응답한다. 한국 서비스이므로 원화로 환산해 노출한다.
    # 환율이 바뀌면 이 값만 조정하면 된다 (코드 수정 불필요).
    eur-to-krw: ${EUR_TO_KRW:1450}

    # 견적 산출 방식 — 이 값 하나로 결정된다. 프로필 조합에 의존하지 않는다.
    #   stub   사용자가 고른 손상 유형 기반 규칙 견적 (AI 서버 불필요)
    #   model  AI 진단 서버(FastAPI) 호출
    provider: ${ESTIMATE_PROVIDER:stub}

    # AI 분석 도중 서버가 중단되어 DRAFT · ANALYZING 으로 남은 접수 건을
    # 이 시간이 지나면 ESTIMATE_FAILED 로 정리한다 (사용자가 재시도할 수 있도록).
    stale-draft-minutes: ${STALE_DRAFT_MINUTES:10}

    # provider=model 일 때만 사용된다
    ai-base-url: ${AI_BASE_URL:http://localhost:8000}
    ai-timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

  demo:
    auto-handover: true           # 기사 앱 배포 시 false

    # 자동 인계 실행 주기(ms). 대상이 없으면 조회 한 번으로 끝나므로 짧아도 부하가 없다.
    # 시연 중 "예약 → 수거 완료" 대기 시간이 이 값만큼 걸린다.
    handover-interval-ms: ${HANDOVER_INTERVAL_MS:15000}
    # @Value 는 YAML 리스트(- item)를 읽지 못한다. 콤마 구분 문자열이어야
    # ConversionService 가 List<String> 으로 변환한다.
    handover-photo-urls: ${FILE_BASE_URL:http://localhost:8080/files}/demo/handover-1.jpg,${FILE_BASE_URL:http://localhost:8080/files}/demo/handover-2.jpg,${FILE_BASE_URL:http://localhost:8080/files}/demo/handover-3.jpg
    customer-sign-url: ${FILE_BASE_URL:http://localhost:8080/files}/demo/sign-customer.png
    driver-sign-url: ${FILE_BASE_URL:http://localhost:8080/files}/demo/sign-driver.png

  chatbot:
    # AI 상담 챗봇(FastAPI) 주소. 비우면 ChatRestController 가 503 안내 문구를 돌려준다.
    base-url: ${CHATBOT_BASE_URL:http://localhost:8001}
    timeout-seconds: ${CHATBOT_TIMEOUT_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha       # 메서드 알파벳 정렬
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

logging:
  level:
    com.ladder.mcmcare: DEBUG
    org.hibernate.SQL: DEBUG
